<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmundo Murima - Grid & Flexbox Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-grid">
        <header class="dash-header"><h2>Edmundo Murima Control Panel</h2></header>
        <aside class="dash-sidebar">
            <a href="#">Dashboard</a>
            <a href="#">Reports</a>
        </aside>
        <main class="dash-content">
        
            <div class="cards-grid">
                <div class="flex-card">
                    <span class="card-title">Users</span>
                    <span class="card-value">1,240</span>
                </div>
                <div class="flex-card">
                    <span class="card-title">Revenue</span>
                    <span class="card-value">$12,450</span>
                </div>
                <div class="flex-card">
                    <span class="card-title">Tasks</span>
                    <span class="card-value">34</span>
                </div>
                <div class="flex-card">
                    <span class="card-title">Performance</span>
                    <span class="card-value">98%</span>
                </div>
            </div>

            
            <div class="table-section">
                <h3>Recent Activities</h3>
                <table>
                    <tr><th>Project</th><th>Status</th><th>Date</th></tr>
                    <tr><td>Web Club Portal</td><td>Completed</td><td>Oct 24</td></tr>
                    <tr><td>Bridge Analysis</td><td>In Progress</td><td>Oct 22</td></tr>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
